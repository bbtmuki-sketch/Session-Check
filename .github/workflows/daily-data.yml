name: Tägliche Marktdaten

on:
  schedule:
    # 05:15 UTC = 06:15 bzw. 07:15 Wien (je nach Sommer-/Winterzeit), vor dem US-Pre-Market
    - cron: "15 5 * * 1-5"
  workflow_dispatch: {} # manueller Start über den "Run workflow"-Button zum Testen

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Daten abrufen
        run: node session-bias-dashboard/scripts/fetch-daily.mjs

      - name: Änderungen committen
        run: |
          git config user.name "daily-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add session-bias-dashboard/data/daily.json
          git diff --cached --quiet || git commit -m "Tägliche Marktdaten aktualisiert"
          git push
